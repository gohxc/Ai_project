<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Claude Code 管理面板</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">FC</div>
          <div>
            <h1>Free Claude Code</h1>
            <p>服务控制台</p>
          </div>
        </div>
        <nav id="sectionNav" class="section-nav" aria-label="设置分区"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">本地管理</p>
            <h2>运行时配置</h2>
          </div>
          <div class="server-state">
            <span id="serverStatus" class="status-pill neutral">加载中</span>
            <span id="modelBadge" class="model-badge"></span>
          </div>
        </header>

        <section class="provider-strip" aria-label="提供方状态">
          <div class="strip-header">
            <h3>提供方</h3>
            <button id="refreshLocal" class="ghost-button" type="button">检查本地</button>
          </div>
          <div id="providerGrid" class="provider-grid"></div>
        </section>

        <section id="formSections" class="form-sections" aria-label="配置项"></section>

        <section class="env-panel">
          <div class="section-heading">
            <div>
              <h3>生成的 Env</h3>
              <p>受管理配置文件的只读预览。</p>
            </div>
          </div>
          <pre id="envPreview" class="env-preview"></pre>
        </section>
      </main>

      <footer class="action-bar">
        <div class="action-meta">
          <strong id="dirtyState">无更改</strong>
          <span id="configPath"></span>
        </div>
        <div id="messageArea" class="message-area"></div>
        <div class="action-buttons">
          <button id="validateButton" class="secondary-button" type="button">验证</button>
          <button id="applyButton" class="primary-button" type="button" disabled>应用</button>
        </div>
      </footer>
    </div>
    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
